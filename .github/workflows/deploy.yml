name: Test and Deploy to VPS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────── tests unitaires ───────────────
  test:
    name: Tests unitaires (PHPUnit)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_sqlite, sqlite3
        coverage: none

    - name: Install dependencies (PHPUnit)
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Run PHPUnit
      run: vendor/bin/phpunit --configuration phpunit.xml

  # ─────────────── déploiement sur le VPS ───────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test                       # bloqué si les tests échouent
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up SSH Key
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy via SSH
      env:
        VPS_IP: ${{ secrets.VPS_IP }}
        VPS_USER: ${{ secrets.VPS_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "StrictHostKeyChecking no" >> ~/.ssh/config
        ssh $VPS_USER@$VPS_IP << 'EOF'
          cd /var/www/ALTF4
          git pull origin main
          sudo chown -R www-data:www-data /var/www/ALTF4
        EOF