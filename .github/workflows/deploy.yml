name: CI/CD Pipeline - Tests & Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code source
      uses: actions/checkout@v4

    - name: Configuration de PHP 8.5
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite
        coverage: none

    - name: Installation des dépendances (Composer)
      uses: ramsey/composer-install@v3

    - name: Exécution des tests unitaires
      run: |
        if [ -f "phpunit.xml" ] || [ -f "phpunit.xml.dist" ]; then
          vendor/bin/phpunit --colors=always
        else
          echo "Aucun fichier phpunit.xml détecté."
          exit 1
        fi

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Récupération du code source
      uses: actions/checkout@v4

    - name: Configuration de la clé SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Déploiement sur le VPS
      env:
        VPS_IP: ${{ secrets.VPS_IP }}
        VPS_USER: ${{ secrets.VPS_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "StrictHostKeyChecking no" >> ~/.ssh/config
        ssh $VPS_USER@$VPS_IP << 'EOF'
          cd /var/www/ALTF4
          git pull origin main
          sudo chown -R www-data:www-data /var/www/ALTF4
        EOF